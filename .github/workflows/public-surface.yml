name: Public release surface

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile public examples
        run: python -m compileall -q examples
      - name: Validate release documentation
        run: python scripts/validate_public_release.py
