name: Bug report
description: Report a reproducible Inflect v2 inference or integration problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - Inflect-Micro-v2
        - Inflect-Nano-v2
        - Inflect v2 Space
        - GitHub examples or documentation
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Hugging Face commit, Git commit, or package version.
      placeholder: Commit hash or version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command or code
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error and a short non-sensitive audio sample when relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PyTorch, CPU/GPU, and available memory.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I removed tokens, private recordings, and other sensitive data.
          required: true
