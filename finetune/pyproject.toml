[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inflect-finetune"
version = "0.1.0"
description = "Generic language and fixed-voice adaptation toolkit for Inflect v2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "soundfile>=0.12,<1",
  "torch>=2.2",
  "phonemizer>=3.2,<4",
  "espeakng-loader>=0.2.4,<1",
  "huggingface-hub>=0.27,<2",
  # Warm-starting imports the released package's own runtime, and its text
  # cleaners import unidecode while its English frontend imports num2words.
  # Without these, train and export fail on a released base rather than on
  # anything the caller wrote.
  "num2words>=0.5.14",
  "Unidecode>=1.3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]
onnx = [
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
]
# Japanese frontend. pyopenjtalk-plus publishes prebuilt wheels; the upstream
# pyopenjtalk project does not for every supported interpreter.
ja = [
  "pyopenjtalk-plus>=0.4,<0.5",
]
# Korean frontend. g2pkk installs its morpheme analyzer on first import instead
# of declaring it, so the analyzer is named here: the install stays deterministic
# and does not need to reach the network from inside an import.
ko = [
  "g2pkk>=0.1.2,<0.2",
  "python-mecab-ko>=1.3,<2",
  "python-mecab-ko-dic>=2.1,<3",
]

[project.scripts]
inflect-adapt = "inflect_finetune.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inflect_finetune*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
