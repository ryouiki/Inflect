<text class="value" x="1076" y="206">3.07%</text>
<text class="label" x="56" y="274">Inflect-Micro-v2</text>
<line x1="360" y1="268" x2="918.1" y2="268" stroke="#1769E0" stroke-width="4"/>
<circle cx="918.1" cy="268" r="8" fill="#1769E0"/>
