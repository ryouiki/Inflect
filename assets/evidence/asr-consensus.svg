<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
<rect width="1200" height="590" rx="18" fill="#F8FBFF"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#10253F}.title{font-size:28px;font-weight:750;letter-spacing:-.5px}.subtitle{font-size:14px;fill:#61738A}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#61738A}.value{font-size:14px;font-weight:750}.grid{stroke:#DCE6F1;stroke-width:1}</style>
<rect x="0" y="0" width="8" height="590" rx="4" fill="#1769E0"/>
<text class="title" x="56" y="52">Intelligibility on unseen text</text>
<text class="subtitle" x="56" y="78">Two-ASR consensus semantic WER · Qwen3-ASR + Nemotron 3.5 · 400 matched prompts</text>
