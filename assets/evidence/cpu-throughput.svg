<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Inflect v2 managed CPU deployment profile</title>
  <desc id="desc">Inflect Micro v2 runs at 6.28 times real time and Inflect Nano v2 at 10.72 times real time on the managed 8 vCPU reference.</desc>
  <style>
    .bg { fill: #f8fbff; }
    .navy { fill: #082650; }
    .muted { fill: #60728d; }
    .blue { fill: #1769e0; }
    .cyan { fill: #65bff3; }
    .grid { stroke: #d7e4f3; stroke-width: 1; }
    .baseline { stroke: #1769e0; stroke-width: 2; stroke-dasharray: 5 6; }
    .title { font: 700 30px Arial, sans-serif; }
    .subtitle { font: 400 17px Arial, sans-serif; }
    .label { font: 700 20px Arial, sans-serif; }
    .meta { font: 400 15px Arial, sans-serif; }
    .tick { font: 500 14px Arial, sans-serif; }
    .value { font: 700 22px Arial, sans-serif; }
    .note { font: 400 14px Arial, sans-serif; }
  </style>
  <rect class="bg" width="1200" height="470" rx="16"/>
  <text class="navy title" x="56" y="58">CPU deployment profile</text>
  <text class="muted subtitle" x="56" y="88">Managed 8-vCPU reference · four framework threads · end-to-end text-to-waveform synthesis</text>

  <line class="grid" x1="300" y1="138" x2="1100" y2="138"/>
  <line class="grid" x1="300" y1="348" x2="1100" y2="348"/>
  <g class="muted tick">
    <text x="296" y="126">0x</text>
    <text x="424" y="126">2x</text>
    <text x="557" y="126">4x</text>
    <text x="690" y="126">6x</text>
    <text x="824" y="126">8x</text>
    <text x="950" y="126">10x</text>
    <text x="1080" y="126">12x</text>
  </g>
  <g class="grid">
    <line x1="300" y1="138" x2="300" y2="348"/>
    <line x1="433" y1="138" x2="433" y2="348"/>
    <line x1="567" y1="138" x2="567" y2="348"/>
    <line x1="700" y1="138" x2="700" y2="348"/>
    <line x1="833" y1="138" x2="833" y2="348"/>
    <line x1="967" y1="138" x2="967" y2="348"/>
    <line x1="1100" y1="138" x2="1100" y2="348"/>
  </g>
  <line class="baseline" x1="367" y1="138" x2="367" y2="348"/>
  <text class="blue meta" x="377" y="158">1x real-time threshold</text>

  <text class="navy label" x="56" y="211">Inflect-Micro-v2</text>
  <text class="muted meta" x="56" y="236">9.36M parameters · 37.53 MB FP32</text>
  <rect x="300" y="181" width="419" height="60" rx="5" fill="#1769e0"/>
  <text class="navy value" x="737" y="220">6.28x</text>

  <text class="navy label" x="56" y="307">Inflect-Nano-v2</text>
  <text class="muted meta" x="56" y="332">3.97M parameters · 15.97 MB FP32</text>
  <rect x="300" y="277" width="715" height="60" rx="5" fill="#65bff3"/>
  <text class="navy value" x="1033" y="316">10.72x</text>

  <text class="muted note" x="56" y="408">100 fixed Modern400 prompts · three passes · cache-building pass excluded · steady-state pool from passes 2 and 3</text>
  <text class="muted note" x="56" y="432">RTF: Micro 0.1593 · Nano 0.0933. Hardware, thread settings, software versions, and text length affect results.</text>
</svg>
